<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropSpot - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="shell">
        <div class="brand">Drop<span>Spot</span></div>
        <div class="subtitle">Create an account to get started.</div>

        <div class="card">
            <h1>Register</h1>

            <div class="message" id="error-message" style="display: none;"></div>

            <form id="register-form">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>

                <label>Username</label>
                <input type="text" id="username" placeholder="pick_a_username" required minlength="3" maxlength="20">

                <label>Password</label>
                <input type="password" id="password" required minlength="8">

                <button type="submit">Create Account</button>
            </form>

            <div class="footer-link">Already have an account? <a href="/login">Login</a></div>
        </div>
    </div>
</body>
<script src="../js/register.js"></script>
</html>
