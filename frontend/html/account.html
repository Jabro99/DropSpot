<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropSpot - Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body style="height: auto; overflow-y: auto; display: block;">

<header>
  <div class="logo">Drop<span>Spot</span></div>
  <div class="header-actions">
    <button id="back-home-btn">Back to Map</button>
    <button class="btn" id="logout-btn">Log Out</button>
  </div>
</header>

<div style="max-width: 700px; margin: 30px auto; padding: 0 20px;">

  <div class="card" style="margin-bottom: 24px;">
    <h1>Account</h1>
    <div class="field-label" style="margin-top: 16px;">Email</div>
    <div id="user-email" style="font-size: 0.9rem;"></div>
  </div>

  <div class="card" style="margin-bottom: 24px;">
    <h1>My Spots</h1>
    <div id="my-spots-list" class="spots-list" style="max-height: none;"></div>
  </div>

  <div class="card">
    <h1>My Comments</h1>
    <div id="my-comments-list" class="spots-list" style="max-height: none;"></div>
  </div>

</div>

<script src="../js/account.js"></script>
</body>
</html>
